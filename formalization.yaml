# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for formalization projects.
version: "v0.4"

project:
  name: "Catalan worthiness"
  authors:
    - "rain1"
    - "Aristotle (Harmonic)"
  responsible_maintainers:
    - "rain1"
  license: "unlicensed (no LICENSE file at time of writing)"

sources:
  - title: "The base note on worthiness of approximation sequences"
    authors: ["rain1"]
    type: "unpublished note"
    location: "Sections 1–22; worthiness δ(q,p) (Definition 1.2), the lattice construction and the balanced-minima estimates (22.20)–(22.25)"
    relationship: "formalizes"
  - title: "The unconditional note"
    authors: ["rain1"]
    type: "unpublished note"
    location: "Section 10 (Theorem 10.1, the Catalan worthiness theorem) and Section 11 (Theorem 11.1, the balanced two-row selection)"
    relationship: "formalizes"

related_formalizations:
  - name: "mathlib4"
    id: "https://github.com/leanprover-community/mathlib4"
    note: "foundation of the development (pinned at v4.32.2)"
  - name: "PrimeNumberTheoremAnd (PNT+)"
    id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
    note: "supplies the weak prime number theorem (WeakPNT'') used for the growth rate of the least-common-multiple sequence (RequestProject/PNT.lean)"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11J72", "11J82"]

status:
  scope: >
    Formalizes the worthiness (construction quality) invariant δ(q,p) for admissible
    approximation sequences, Archimedean and p-adic rate machinery for the Pade/Zudilin
    and Nesterenko approximants to Catalan's constant. This is work in progress:
    the current comparator statement has a known specification gap because it does
    not constrain the witnesses to the intended Nesterenko row. Under the public
    definitions its 1-ε conclusion follows for every real number from elementary
    rounding. The structured no-input theorem is not yet complete.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "Catalan.catalan_worthiness_one_sub_eps_unconditional"
      file: "RequestProject/Unconditional.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.config.json"
      literature_dependencies: []
      note: "WIP regression theorem exposing the weak existential specification; not the intended structured Nesterenko result."

automation:
  methods:
    - method: "agent"
      framework: "Aristotle (Harmonic), https://aristotle.harmonic.fun"
      prompting_notes: "Initial formalization imported from an Aristotle run; see README."
    - method: "agent"
      framework: "Kimi Code CLI (Moonshot AI)"
      prompting_notes: "Completed the in-progress Lean/mathlib v4.32.2 + PNT+ dependency upgrade and set up comparator/formalization.yaml."
  notes: "WIP. Build-verified with `lake build` on leanprover/lean4:v4.32.2; the current specification-gap regression theorem is configured for comparator."

fidelity:
  divergences: >
    The worthiness invariant δ(q,p) is taken in EReal so that the liminf always exists
    (Definition 1.2).  In particular, admissibility does not require the linear forms
    q n * α - p n to tend to zero.  Therefore the elementary choice q n = 2^(n+1),
    p n = floor (q n * α) - 1 already proves the exported 1-ε theorem for every
    real α.  The more structured Nesterenko-row development is retained separately;
    its remaining special-value and real-rate bridges are not dependencies of the
    exported theorem.

review:
  status: "agent-reviewed"
  reviewers: ["Aristotle (Harmonic)", "Kimi Code CLI"]
  notes: >
    No human peer review. The development type-checks under Lean v4.32.2 with zero
    sorries in the project modules, and the main theorem is verified by
    leanprover/comparator against comparator.config.json (challenge in Challenge.lean,
    solution in Solution.lean).

alignment:
  namespace: "Catalan"
  statements:
    - source: "Definition 1.1 (admissible approximation sequence)"
      lean: "Catalan.IsAdmissible"
      module: "RequestProject/Worthiness.lean"
      status: "proved"
    - source: "Definition 1.2 (worthiness δ(q,p))"
      lean: "Catalan.worthiness"
      module: "RequestProject/Worthiness.lean"
      status: "proved"
    - source: "Current weak existential statement (WIP regression test)"
      lean: "Catalan.catalan_worthiness_one_sub_eps_unconditional"
      module: "RequestProject/Unconditional.lean"
      status: "proved"
      note: "This is not yet aligned with the intended Nesterenko-row provenance."
    - source: "Theorem 11.1 (balanced two-row selection)"
      lean: "Catalan.two_row_selection"
      module: "RequestProject/TwoRow.lean"
      status: "proved"
    - source: "Estimates (22.20)–(22.23), (22.25) of the base note"
      lean: "Catalan.BalancedMinimaData"
      module: "RequestProject/Final.lean"
      status: "literature-dependency"
      note: "Packaged as a structure and taken as a hypothesis; not reproved."

acknowledgements: >
  Built on mathlib4 and PrimeNumberTheoremAnd (Alex Kontorovich and collaborators).
  Initial formalization by Aristotle (Harmonic). Verification tooling:
  leanprover/comparator with lean4export and landrun.
